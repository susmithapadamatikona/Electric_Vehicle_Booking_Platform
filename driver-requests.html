<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ride Requests | Driver Hub | Stackly</title>
    <meta name="description" content="Manage your listed EVs, accept booking requests, track earnings and monitor vehicle health.">
    <meta name="theme-color" content="#050B10">
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/vehicles.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="icon" href="assets/images/favicon.png" type="image/png">
</head>
<body class="dash-body">
<div class="preloader" id="preloader" role="status" aria-live="polite" aria-label="Loading">
    <div class="preloader-inner">
        <img src="assets/images/stackly-whitish_blue-logo.webp" alt="Stackly"
             class="preloader-logo" width="320" height="132">
        <div class="preloader-bar"></div>
    </div>
</div>


<div class="dash-layout">
    <div id="sidebarSlot"></div>

    <div class="dash-main">
        <div id="topbarSlot"></div>

        <div class="dash-content">

<section data-dash-section="requests">
                <div class="dash-page-head">
                    <div>
                        <h1>Booking requests</h1>
                        <p>Accept or decline. Faster responses rank your vehicles higher.</p>
                    </div>
                </div>
                <div class="dash-grid-3" id="requestsGrid"></div>
            </section>

        </div>
    </div>
</div>

<script src="assets/vendor/lucide.min.js"></script>
<script type="module" src="js/driver.js"></script>

</body>
</html>
