<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Earnings | Driver Hub | Stackly</title>
    <meta name="description" content="Manage your listed EVs, accept booking requests, track earnings and monitor vehicle health.">
    <meta name="theme-color" content="#050B10">
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/vehicles.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="icon" href="assets/images/favicon.png" type="image/png">
</head>
<body class="dash-body">
<div class="preloader" id="preloader" role="status" aria-live="polite" aria-label="Loading">
    <div class="preloader-inner">
        <img src="assets/images/stackly-whitish_blue-logo.webp" alt="Stackly"
             class="preloader-logo" width="320" height="132">
        <div class="preloader-bar"></div>
    </div>
</div>


<div class="dash-layout">
    <div id="sidebarSlot"></div>

    <div class="dash-main">
        <div id="topbarSlot"></div>

        <div class="dash-content">

<section data-dash-section="earnings">
                <div class="dash-page-head">
                    <div>
                        <h1>Earnings</h1>
                        <p>What each vehicle brings in, before and after platform fees.</p>
                    </div>
                    <button class="btn btn-secondary" id="exportEarnings">
                        <i data-lucide="download"></i> Export
                    </button>
                </div>

                <div class="kpi-strip" id="earningsKpi"></div>

                <div class="dash-grid-2">
                    <div class="panel">
                        <div class="panel-head">
                            <div class="panel-title"><i data-lucide="bar-chart-3"></i> Revenue by vehicle</div>
                        </div>
                        <div class="panel-body"><div class="chart-box"><canvas id="vehicleRevChart"></canvas></div></div>
                    </div>
                    <div class="panel">
                        <div class="panel-head">
                            <div class="panel-title"><i data-lucide="pie-chart"></i> Where the money goes</div>
                        </div>
                        <div class="panel-body"><div class="chart-box"><canvas id="feeChart"></canvas></div></div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-head">
                        <div class="panel-title"><i data-lucide="receipt"></i> Earnings breakdown</div>
                    </div>
                    <div class="panel-body flush">
                        <div class="table-wrap" style="border:none;border-radius:0">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Vehicle</th><th>Trips</th><th>Gross</th>
                                        <th>Platform fee</th><th>Charging</th><th>Net</th><th>Utilisation</th>
                                    </tr>
                                </thead>
                                <tbody id="earningsTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </div>
</div>

<script src="assets/vendor/lucide.min.js"></script>
<script type="module" src="js/driver.js"></script>

</body>
</html>
